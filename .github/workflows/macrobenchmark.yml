name: Macrobenchmark Manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrobenchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
      - name: Run cold-start Macrobenchmark
        run: |
          ./gradlew --no-daemon \
            :macrobenchmark:pixel6Api34BenchmarkAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR \
            -Pandroid.testInstrumentationRunnerArguments.listener=androidx.benchmark.macro.junit4.SideEffectRunListener \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --stacktrace
      - name: Upload benchmark reports and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worktime-macrobenchmark-results
          path: |
            macrobenchmark/build/reports/androidTests/
            macrobenchmark/build/outputs/androidTest-results/
            macrobenchmark/build/outputs/managed_device_android_test_additional_output/
            macrobenchmark/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 14
