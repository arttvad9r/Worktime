name: Generate Baseline Profile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-baseline-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Generate Baseline Profile
        run: ./scripts/generate_baseline_profile.sh

      - name: Upload generated profile
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worktime-baseline-profile
          path: app/src/**/generated/baselineProfiles/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload generator reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worktime-baseline-profile-reports
          path: |
            baselineprofile/build/outputs/managed_device_android_test_additional_output/
            baselineprofile/build/outputs/androidTest-results/
            baselineprofile/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
